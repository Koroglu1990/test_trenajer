        return `${String(min).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;

    let quizNotice = "";          // короткое сообщение над вопросом
    let shuffledOptionsCache = [];
    let isPreselectMode = false;
    let quizStartTime = null;
    let currentStudentGroup = null;   // 'programmers' | 'designers' | 'other'
    const DESIGNER_SECTION_KEYS = ["quality", "drawing", "painting", "history", "commdesign"];

    // ========== РАБОТА С LOCALSTORAGE ==========
    function loadAllAttempts() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        try { return JSON.parse(raw); } catch(e) { return {}; }
    }
    function saveAllAttempts(attemptsData) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(attemptsData));
    }
    function addAttempt(sectionId, sectionName, modeName, correctCount, totalCount, percentage, modeId, duration) {
        if (!currentStudent) return;
        const attemptsData = loadAllAttempts();
        const studentKey = currentStudent.id;
        if (!attemptsData[studentKey]) attemptsData[studentKey] = { name: currentStudent.name, attempts: [] };
        attemptsData[studentKey].attempts.unshift({
            date: new Date().toISOString(),
            sectionId, sectionName, modeName, modeId, duration,
            correct: correctCount, total: totalCount, percent: percentage, timestamp: Date.now()
        });
        if (attemptsData[studentKey].attempts.length > 50) attemptsData[studentKey].attempts.pop();
        saveAllAttempts(attemptsData);
    }
    function getBestScoreForSection(sectionId) {
        if (!currentStudent) return null;
        const attemptsData = loadAllAttempts();
        const studentKey = currentStudent.id;
        if (!attemptsData[studentKey]) return null;
        const sectionAttempts = attemptsData[studentKey].attempts.filter(a => a.sectionId === sectionId);
        if (!sectionAttempts.length) return null;
        return Math.max(...sectionAttempts.map(a => a.percent));
    }
    
    // ========== ФУНКЦИЯ ОЧИСТКИ ИСТОРИИ ==========
    function clearHistory() {
        if (!currentStudent) return;
        if (confirm(`Вы уверены, что хотите удалить ВСЮ историю результатов для пользователя "${currentStudent.name}"? Это действие нельзя отменить.`)) {
            const attemptsData = loadAllAttempts();
            if (attemptsData[currentStudent.id]) {
                attemptsData[currentStudent.id].attempts = [];
                saveAllAttempts(attemptsData);
                renderRecentAttempts();  // обновляем отображение истории
                renderMainMenu();        // обновляем лучшие результаты в разделах
                alert("✅ История успешно очищена!");
            }
        }
    }
    
    // Метка типа пройденного теста для истории (10 / 20 / 60 / 60 с выделенными ответами)
    function modeBadgeHtml(att) {
        const m = MODES.find(x => x.id === att.modeId);
        const label = m ? m.label : (att.modeName || 'режим');
        const cls = (m && m.preselect) ? 'mode-badge badge-preselect' : 'mode-badge';
        return `<span class="${cls}">${m && m.preselect ? '💡' : '📝'} ${label}</span>`;
    }

    function renderRecentAttempts() {
        const container = document.getElementById("recentAttemptsPanel");
        if (!container || !currentStudent) return;
        const attemptsData = loadAllAttempts();
        const userAttempts = attemptsData[currentStudent.id]?.attempts || [];
        
        if (!userAttempts.length) {
            container.innerHTML = "<p style='color:#64748b; text-align:center;'>📭 Пока нет попыток</p><button id='clearHistoryBtn' class='clear-history-btn' style='margin-top:12px;'>🗑️ Очистить историю</button>";
            document.getElementById("clearHistoryBtn")?.addEventListener("click", clearHistory);
            return;
        }
        
        let html = `<div class="attempts-list">`;
        userAttempts.slice(0, 8).forEach(att => {
            html += `<div class="attempt-item">
                <div class="attempt-date">📅 ${new Date(att.date).toLocaleString()}</div>
                <div><strong>${att.sectionName}</strong> ${modeBadgeHtml(att)}</div>
                <div>${att.correct}/${att.total} (${att.percent}%)${att.duration ? ` · ⏱ ${att.duration}` : ""}</div>
            </div>`;
        });
        html += `</div>`;
        if (userAttempts.length > 8) html += `<div style="font-size:0.75rem; text-align:center; margin:8px 0;">+ еще ${userAttempts.length-8} попыток</div>`;
        
        html += `<button id="clearHistoryBtn" class="clear-history-btn">🗑️ Очистить всю историю</button>`;
        container.innerHTML = html;
        
        document.getElementById("clearHistoryBtn")?.addEventListener("click", clearHistory);
    }

    // ========== ФОРМИРОВАНИЕ ВЫБОРКИ ВОПРОСОВ ==========
    function getRandomQuestions(sectionTests, mode) {
        const totalAvailable = sectionTests.length;
        let needed = mode.count;
        if (needed > totalAvailable) needed = totalAvailable;
        const shuffledFull = shuffleArray([...sectionTests]);
        return shuffledFull.slice(0, needed);
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ========== ЗАПУСК РАЗДЕЛА ==========
    function startSectionWithMode(sectionId, mode) {
        currentSectionId = sectionId;
        currentMode = mode;
        isPreselectMode = mode.preselect;
        const section = SECTIONS[sectionId];
        if (!section || !section.tests.length) return;
        
        currentQuestions = getRandomQuestions(section.tests, mode);
        if (currentQuestions.length === 0) return;
        currentQuestions = shuffleArray(currentQuestions);
        
        userAnswers = new Array(currentQuestions.length).fill(null);
        shuffledOptionsCache = currentQuestions.map(q => shuffleArray([...(q.options || [])]));
        currentIndex = 0;
        quizFinished = false;
        quizStartTime = Date.now();
        resetSkipState();
        
        document.getElementById("mainMenu").style.display = "none";
        document.getElementById("quizPanel").style.display = "block";
        const modeBadge = `<span class="mode-badge">${mode.name}</span>`;
        document.getElementById("sectionTitle").innerHTML = `${section.icon} ${section.name} ${modeBadge}`;
        
        renderCurrentQuestion();
    }

    // ========== ВОПРОСЫ С НЕСКОЛЬКИМИ ПРАВИЛЬНЫМИ ОТВЕТАМИ ==========
    function isMultiQuestion(q) { return Array.isArray(q.correct); }
    function isInputQuestion(q) { return q && q.type === "input"; }
    // нормализация введённого ответа: регистр, ё/е, пробелы, кавычки и знаки по краям
    function normalizeAnswer(str) {
        return String(str || "").toLowerCase().replace(/ё/g, "е")
            .replace(/[«»"'“”„]/g, "").replace(/\s+/g, " ")
            .replace(/^[\s.,;:!?()\-–—]+|[\s.,;:!?()\-–—]+$/g, "").trim();
    }
    function isBlankCorrect(q, k, value) {
        const v = normalizeAnswer(value);
        return v !== "" && (q.blanks[k] || []).some(acc => normalizeAnswer(acc) === v);
    }
    function isInputCorrect(q, values) {
        return q.blanks.every((_, k) => isBlankCorrect(q, k, (values || [])[k]));
    }
    function isAnswered(i) {
        const a = userAnswers[i];
        if (isInputQuestion(currentQuestions[i])) return Array.isArray(a) && a.length === currentQuestions[i].blanks.length && a.every(x => String(x || "").trim() !== "");
        return Array.isArray(a) ? a.length > 0 : a !== null;
    }

    // ========== ПРОПУСК ВОПРОСОВ ==========
    function resetSkipState() {
        skippedSet = new Set();
        reviewMode = false;
        quizNotice = "";
    }
    function unansweredIndices() {
        const r = [];
        for (let i = 0; i < currentQuestions.length; i++) if (!isAnswered(i)) r.push(i);
        return r;
    }
    // ближайший вопрос без ответа после idx (по кругу), либо -1, если таких нет
    function nextUnansweredAfter(idx) {
        const n = currentQuestions.length;
        for (let step = 1; step < n; step++) {
            const j = (idx + step) % n;
            if (!isAnswered(j)) return j;
        }
        return -1;
    }
    // вопросы без ответа, которые уже «пройдены»: пропущенные или оставшиеся позади
    function getSkippedList() {
        const r = [];
        for (let i = 0; i < currentQuestions.length; i++) {
            if (i === currentIndex || isAnswered(i)) continue;
            if (skippedSet.has(i) || i < currentIndex) r.push(i);
        }
        return r;
    }
    function getNextLabel() {
        const othersLeft = nextUnansweredAfter(currentIndex) !== -1;
        if (reviewMode) return othersLeft ? "➡️ Дальше" : "🏁 Завершить";
        if (currentIndex === currentQuestions.length - 1) return othersLeft ? "↩️ К пропущенным" : "🏁 Завершить";
        return "➡️ Дальше";
    }
    function goNext() {
        quizNotice = "";
        const last = currentQuestions.length - 1;
        if (reviewMode) {
            const target = nextUnansweredAfter(currentIndex);
            if (target === -1) { finishQuiz(); return; }
            currentIndex = target;
            renderCurrentQuestion();
            return;
        }
        if (currentIndex < last) { currentIndex++; renderCurrentQuestion(); return; }
        // последний вопрос: завершить можно, только если на всё отвечено
        const left = unansweredIndices();
        if (left.length === 0) { finishQuiz(); return; }
        reviewMode = true;
        quizNotice = `Остались вопросы без ответа: ${left.length}. Ответьте на них, чтобы завершить тест.`;
        currentIndex = left[0];
        renderCurrentQuestion();
    }
    function skipCurrent() {
        if (quizFinished || isAnswered(currentIndex)) return;
        quizNotice = "";
        skippedSet.add(currentIndex);
        const target = nextUnansweredAfter(currentIndex);
        if (target === -1) {
            quizNotice = "Это последний вопрос без ответа — ответьте на него, чтобы завершить тест.";
            renderCurrentQuestion();
            return;
        }
        if (target < currentIndex) {
            reviewMode = true;
            quizNotice = `Вы дошли до конца и вернулись к пропущенным. Осталось без ответа: ${unansweredIndices().length}.`;
        }
        currentIndex = target;
        renderCurrentQuestion();
    }

    // ========== ОТРИСОВКА ВОПРОСА ==========
    function renderCurrentQuestion() {
        if (quizFinished) return;
        if (currentIndex >= currentQuestions.length) { finishQuiz(); return; }
        
        const questionObj = currentQuestions[currentIndex];
        const shuffledOptions = shuffledOptionsCache[currentIndex];
        const selectedIdx = userAnswers[currentIndex];
        const multi = isMultiQuestion(questionObj);
        
        // Индекс(ы) правильного ответа в перемешанных вариантах
        const correctIndices = [];
        shuffledOptions.forEach((opt, i) => {
            if (multi ? questionObj.correct.includes(opt) : opt === questionObj.correct) correctIndices.push(i);
        });
        // Индекс(ы), выбранные пользователем
        const chosen = multi ? (Array.isArray(selectedIdx) ? selectedIdx : []) : (selectedIdx === null ? [] : [selectedIdx]);
        
        let progressHtml = `<span>📝 Вопрос ${currentIndex+1} из ${currentQuestions.length}</span>`;
        const skippedNow = getSkippedList();
        if (skippedNow.length) {
            progressHtml += `<div class="skipped-row"><span class="skipped-info">⏭ Пропущено: ${skippedNow.length} (№${skippedNow.map(i => i + 1).join(", №")})</span><button id="goSkippedBtn" class="skip-link" type="button">К пропущенным →</button></div>`;
        }
        document.getElementById("progressArea").innerHTML = progressHtml;
        document.getElementById("goSkippedBtn")?.addEventListener("click", () => {
            if (quizFinished) return;
            quizNotice = "";
            const list = getSkippedList();
            if (!list.length) return;
            const after = list.find(i => i > currentIndex);
            currentIndex = after !== undefined ? after : list[0];
            renderCurrentQuestion();
        });
        
        let optionsHtml = "";
        
        // ========== ЛОГИКА РАЗНЫХ РЕЖИМОВ ==========
        if (isPreselectMode) {
            // РЕЖИМ "ОТВЕТЫ ВЫДЕЛЕНЫ" — жёлтая подсказка, после выбора зелёный/красный
            shuffledOptions.forEach((opt, idx) => {
                let additionalClass = "";
                const isChosen = chosen.includes(idx);
                const isCorrectOpt = correctIndices.includes(idx);
                if (isChosen) {
                    additionalClass = isCorrectOpt ? "user-correct" : "user-wrong";   // зелёный — верно, красный — ошибка
                } else if (isCorrectOpt) {
                    additionalClass = "correct-highlight";                            // жёлтый — правильный ответ
                }
                optionsHtml += `<div class="option ${additionalClass}" data-opt-index="${idx}">${escapeHtml(opt)}</div>`;
            });
        } else {
            // ОБЫЧНЫЙ РЕЖИМ — без подсказок, только выделение выбранных ответов
            shuffledOptions.forEach((opt, idx) => {
                let additionalClass = "";
                if (chosen.includes(idx)) {
                    additionalClass = "selected";  // синяя подсветка выбранного варианта
                }
                optionsHtml += `<div class="option ${additionalClass}" data-opt-index="${idx}">${escapeHtml(opt)}</div>`;
            });
        }
        
        // Подсказки
        let hintHtml = "";
        if (isPreselectMode) {
            if (!isAnswered(currentIndex)) {
                hintHtml = multi
                    ? `<div class="hint-text">💡 Жёлтым выделены правильные ответы (их несколько). Отметьте нужные варианты.</div>`
                    : `<div class="hint-text">💡 Жёлтым выделен правильный ответ. Вы можете нажать на любой вариант.</div>`;
            } else {
                hintHtml = multi
                    ? `<div class="hint-text">✅ Верные отмеченные — зелёные, ошибочные — красные, жёлтым остались верные, которые вы не отметили.</div>`
                    : `<div class="hint-text">✅ Вы ответили. Правильный ответ был выделен жёлтым.</div>`;
            }
        } else if (multi) {
            hintHtml = `<div class="hint-text">☑️ Здесь несколько правильных ответов: отметьте все верные и нажмите «Дальше».</div>`;
        }
        
        const noticeHtml = quizNotice ? `<div class="skip-notice">${escapeHtml(quizNotice)}</div>` : "";
        let questionHtml;
        if (isInputQuestion(questionObj)) {
            const values = Array.isArray(userAnswers[currentIndex]) ? userAnswers[currentIndex] : [];
            const parts = questionObj.question.split("________");
            let qHtml = "";
            parts.forEach((part, k) => {
                qHtml += escapeHtml(part);
                if (k < parts.length - 1) {
                    const val = values[k] || "";
                    let cls = "";
                    if (isPreselectMode && String(val).trim() !== "") cls = isBlankCorrect(questionObj, k, val) ? " blank-ok" : " blank-bad";
                    qHtml += `<input type="text" class="blank-input${cls}" data-blank="${k}" autocomplete="off" spellcheck="false" value="${escapeHtml(val).replace(/"/g, "&quot;")}" placeholder="${k + 1}">`;
                }
            });
            let inputHint = `<div class="input-hint">✍️ Впишите пропущенные слова в поля и нажмите «Дальше».</div>`;
            if (isPreselectMode) inputHint = `<div class="hint-text">💡 Правильный ответ: ${escapeHtml(questionObj.correct)}</div>`;
            questionHtml = noticeHtml + `<div class="question-text with-blanks">${qHtml}</div>${inputHint}`;
        } else {
            questionHtml = noticeHtml + `<div class="question-text">${escapeHtml(questionObj.question)}</div><div id="optionsContainer">${optionsHtml}</div>${hintHtml}`;
        }
        document.getElementById("questionArea").innerHTML = questionHtml;
        document.querySelectorAll(".blank-input").forEach(inp => {
            inp.addEventListener("input", () => {
                if (quizFinished) return;
                const k = parseInt(inp.dataset.blank);
                const n = questionObj.blanks.length;
                const cur = Array.isArray(userAnswers[currentIndex]) ? [...userAnswers[currentIndex]] : new Array(n).fill("");
                while (cur.length < n) cur.push("");
                cur[k] = inp.value;
                userAnswers[currentIndex] = cur;
                if (isPreselectMode) {
                    inp.classList.remove("blank-ok", "blank-bad");
                    if (inp.value.trim() !== "") inp.classList.add(isBlankCorrect(questionObj, k, inp.value) ? "blank-ok" : "blank-bad");
                }
                const skip = document.getElementById("skipBtn");
                if (skip) skip.style.display = isAnswered(currentIndex) ? "none" : "";
            });
            inp.addEventListener("keydown", (e) => {
                if (e.key === "Enter") { e.preventDefault(); document.getElementById("nextBtn")?.click(); }
            });
        });
        
        document.querySelectorAll(".option").forEach(div => {
            div.addEventListener("click", (e) => {
                if (quizFinished) return;
                const idx = parseInt(div.dataset.optIndex);
                if (!isNaN(idx)) selectAnswer(idx);
            });
        });
        
        const nextLabel = getNextLabel();
        let navHtml = `<button id="nextBtn">${nextLabel}</button>`;
        if (currentIndex > 0) {
            navHtml = `<div class="footer-buttons"><button id="prevBtn" class="restart-btn">⬅️ Назад</button><button id="nextBtn">${nextLabel}</button></div>`;
        }
        if (!isAnswered(currentIndex)) {
            navHtml += `<button id="skipBtn" class="skip-btn" type="button">⏭️ Пропустить вопрос</button>`;
        }
        document.getElementById("navButtons").innerHTML = navHtml;
        document.getElementById("nextBtn")?.addEventListener("click", () => {
            if (quizFinished) return;
            if (!isAnswered(currentIndex)) {
                alert(isInputQuestion(currentQuestions[currentIndex]) ? "Пожалуйста, заполните все пропуски или нажмите «Пропустить вопрос»!" : "Пожалуйста, выберите ответ или нажмите «Пропустить вопрос»!");
                return;
            }
            goNext();
        });
        document.getElementById("skipBtn")?.addEventListener("click", () => skipCurrent());
        document.getElementById("prevBtn")?.addEventListener("click", () => {
            if (quizFinished) return;
            quizNotice = "";
            if (currentIndex > 0) { currentIndex--; renderCurrentQuestion(); }
        });
    }
    
    function selectAnswer(optIndex) {
        if (quizFinished) return;
        const q = currentQuestions[currentIndex];
        if (isMultiQuestion(q)) {
            // несколько ответов: клик включает/выключает вариант
            const cur = Array.isArray(userAnswers[currentIndex]) ? [...userAnswers[currentIndex]] : [];
            const pos = cur.indexOf(optIndex);
            if (pos >= 0) cur.splice(pos, 1); else cur.push(optIndex);
            userAnswers[currentIndex] = cur;
        } else {
            userAnswers[currentIndex] = optIndex;
        }
        renderCurrentQuestion();
    }
    
    function finishQuiz() {
        quizFinished = true;
        let correctCount = 0;
        const mistakes = [];
        for (let i = 0; i < currentQuestions.length; i++) {
            const q = currentQuestions[i];
            const optionsForQ = shuffledOptionsCache[i];
            let isCorrect, selectedText, correctText;
            if (isInputQuestion(q)) {
                const vals = Array.isArray(userAnswers[i]) ? userAnswers[i] : [];
                isCorrect = isInputCorrect(q, vals);
                selectedText = vals.some(v => String(v || "").trim() !== "") ? vals.map(v => String(v || "").trim() || "—").join("; ") : "(не введён)";
                correctText = q.correct;
            } else if (isMultiQuestion(q)) {
                const chosenIdx = Array.isArray(userAnswers[i]) ? userAnswers[i] : [];
                const chosenTexts = chosenIdx.map(k => optionsForQ[k]);
                isCorrect = chosenTexts.length === q.correct.length && q.correct.every(c => chosenTexts.includes(c));
                selectedText = chosenTexts.length ? chosenTexts.join("; ") : "(не выбран)";
                correctText = q.correct.join("; ");
            } else {
                const selectedIdx = userAnswers[i];
                const selectedAnswer = selectedIdx !== null ? optionsForQ[selectedIdx] : null;
                isCorrect = (selectedAnswer === q.correct);
                selectedText = selectedAnswer || "(не выбран)";
                correctText = q.correct;
            }
            if (isCorrect) correctCount++;
            else mistakes.push({ question: q.question, selected: selectedText, correct: correctText });
        }
        const percentage = Math.round((correctCount / currentQuestions.length) * 100);
        const section = SECTIONS[currentSectionId];
        const elapsedMs = quizStartTime ? (Date.now() - quizStartTime) : 0;
        const durationStr = formatDuration(elapsedMs);
        addAttempt(currentSectionId, section.name, currentMode.name, correctCount, currentQuestions.length, percentage, currentMode.id, durationStr);
        sendReportToGoogleForm({
            name: currentStudent ? currentStudent.name : "",
            discipline: section.name,
            mode: currentMode.label || currentMode.name,
            correct: correctCount,
            total: currentQuestions.length,
            percent: percentage,
            duration: durationStr
        });
        
        let mistakesHtml = mistakes.length ? "<h3>❌ Ошибки (разбор):</h3>" + mistakes.map(m => `<div class="mistake-item"><strong>📌 ${escapeHtml(m.question)}</strong><br>✖ Ваш ответ: ${escapeHtml(m.selected)}<br>✔ Правильный: ${escapeHtml(m.correct)}</div>`).join('') : "<p style='color:#10b981;'>🎉 Идеально!</p>";
        const resultHtml = `
            <h2>📊 Результат (${currentMode.name})</h2>
            <div class="stats"><div style="font-size:2rem;">${correctCount}/${currentQuestions.length}</div><div>✅ ${correctCount}  ❌ ${currentQuestions.length-correctCount}</div><div>${percentage}%</div></div>
            ${mistakesHtml}<hr>
            <div class="footer-buttons"><button id="restartBtn">🔄 Заново (тот же режим)</button><button id="retryMistakesBtn" class="restart-btn">📘 Только ошибки</button></div>
            <button id="backMenuFromResult" class="back-btn">🏠 В меню</button>
        `;
        document.getElementById("quizCard").style.display = "none";
        const resultDiv = document.getElementById("resultCard");
        resultDiv.innerHTML = resultHtml;
        resultDiv.style.display = "block";
        document.getElementById("restartBtn")?.addEventListener("click", () => restartCurrentSection());
        document.getElementById("retryMistakesBtn")?.addEventListener("click", () => {
            if (!mistakes.length) return alert("Нет ошибок!");
            const wrongQuestions = mistakes.map(m => SECTIONS[currentSectionId].tests.find(t => t.question === m.question)).filter(v=>v);
            if(wrongQuestions.length){
                currentQuestions = shuffleArray([...wrongQuestions]);
                userAnswers = new Array(currentQuestions.length).fill(null);
                shuffledOptionsCache = currentQuestions.map(q=>shuffleArray([...(q.options || [])]));
                currentIndex=0; quizFinished=false;
                resetSkipState(); quizStartTime = Date.now();
                document.getElementById("resultCard").style.display="none";
                document.getElementById("quizCard").style.display="block";
                renderCurrentQuestion();
            }
        });
        document.getElementById("backMenuFromResult")?.addEventListener("click", () => backToMenu());
    }
    
    function restartCurrentSection() {
        if(!currentSectionId || !currentMode) return;
        const section = SECTIONS[currentSectionId];
        currentQuestions = getRandomQuestions(section.tests, currentMode);
        currentQuestions = shuffleArray(currentQuestions);
        userAnswers = new Array(currentQuestions.length).fill(null);
        shuffledOptionsCache = currentQuestions.map(q=>shuffleArray([...(q.options || [])]));
        currentIndex=0; quizFinished=false;
        resetSkipState(); quizStartTime = Date.now();
        document.getElementById("resultCard").style.display="none";
        document.getElementById("quizCard").style.display="block";
        renderCurrentQuestion();
    }
    
    function backToMenu() {
        currentSectionId = null;
        document.getElementById("quizPanel").style.display = "none";
        document.getElementById("mainMenu").style.display = "block";
        document.getElementById("quizCard").style.display = "block";
        document.getElementById("resultCard").style.display = "none";
        renderMainMenu();
    }
    
    function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    // ========== ГЛАВНОЕ МЕНЮ ==========
    function renderMainMenu() {
        const sectionsList = document.getElementById("sectionsList");
        sectionsList.innerHTML = "";
        let visibleIds = Object.keys(SECTIONS);
        if (currentStudentGroup === "designers") {
            visibleIds = visibleIds.filter(id => DESIGNER_SECTION_KEYS.includes(id));
        } else if (currentStudentGroup === "programmers") {
            visibleIds = visibleIds.filter(id => !DESIGNER_SECTION_KEYS.includes(id));
        } // "other" или не задано — показываем все дисциплины
        for (const id of visibleIds) {
            const section = SECTIONS[id];
            const bestScore = getBestScoreForSection(id);
            const bestHtml = bestScore !== null ? `<div class="best-score">🏆 лучший: ${bestScore}%</div>` : `<div class="best-score" style="color:#94a3b8;">⭐ ещё не пройден</div>`;
            const wrapper = document.createElement("div");
            wrapper.className = "section-wrapper";
            wrapper.innerHTML = `
                <div class="section-header">
                    <div class="section-icon">${section.icon}</div>
                    <div class="section-title">${section.name}</div>
                    ${bestHtml}
                    <div class="section-count" style="font-size:0.7rem;">📚 ${section.tests.length} вопросов в банке</div>
                </div>
                <div class="modes-container" id="modes-${id}"></div>
            `;
            sectionsList.appendChild(wrapper);
            const modesContainer = document.getElementById(`modes-${id}`);
            MODES.filter(mode => !mode.legacy).forEach(mode => {
                const btn = document.createElement("div");
                btn.className = `mode-btn ${mode.preselect ? 'mode-preselect' : ''}`;
                btn.textContent = mode.name;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    startSectionWithMode(id, mode);
                };
                modesContainer.appendChild(btn);
            });
        }
        renderRecentAttempts();
    }
    
    // ========== ПОЛЬЗОВАТЕЛЬ ==========
    function initUser(name) {
        const trimmed = name.trim();
        if(!trimmed) { alert("Введите имя и фамилию"); return false; }
        const attemptsData = loadAllAttempts();
        let existingId = null;
        for(const [id, data] of Object.entries(attemptsData)) {
            if(data.name.toLowerCase() === trimmed.toLowerCase()) { existingId = id; break; }
        }
        if(existingId) {
            currentStudent = { id: existingId, name: attemptsData[existingId].name };
        } else {
            const newId = "user_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6);
            currentStudent = { id: newId, name: trimmed };
            attemptsData[newId] = { name: trimmed, attempts: [] };
            saveAllAttempts(attemptsData);
        }
        document.getElementById("currentUserBadge").innerHTML = `👋 ${currentStudent.name}`;
        return true;
    }
    
    // ========== ВЫБОР ГРУППЫ (Программисты / Дизайнеры / Другое) ==========
    function showGroupPanel(group) {
        currentStudentGroup = group;
        document.querySelectorAll(".group-btn").forEach(b => b.classList.toggle("active", b.dataset.group === group));
        document.getElementById("programmersGroup").style.display = group === "programmers" ? "block" : "none";
        document.getElementById("designersGroup").style.display = group === "designers" ? "block" : "none";
        const manualGroup = document.getElementById("manualNameGroup");
        const nameInput = document.getElementById("studentNameInput");
        if (group === "other") {
            manualGroup.style.display = "block";
            nameInput.value = "";
            nameInput.focus();
        } else {
            manualGroup.style.display = "none";
            nameInput.value = "";
        }
        // сбрасываем оба select при смене группы
        document.getElementById("programmersSelect").value = "";
        document.getElementById("designersSelect").value = "";
    }
    document.getElementById("groupBtnProgrammers").addEventListener("click", () => showGroupPanel("programmers"));
    document.getElementById("groupBtnDesigners").addEventListener("click", () => showGroupPanel("designers"));
    document.getElementById("groupBtnOther").addEventListener("click", () => showGroupPanel("other"));

    function handleGroupSelectChange(e) {
        const manualGroup = document.getElementById("manualNameGroup");
        const nameInput = document.getElementById("studentNameInput");
        if (e.target.value === "__manual__") {
            manualGroup.style.display = "block";
            nameInput.value = "";
            nameInput.focus();
        } else {
            manualGroup.style.display = "none";
            nameInput.value = e.target.value;
        }
    }
    document.getElementById("programmersSelect").addEventListener("change", handleGroupSelectChange);
    document.getElementById("designersSelect").addEventListener("change", handleGroupSelectChange);

    document.getElementById("startWithNameBtn").addEventListener("click", () => {
        if (!currentStudentGroup) { alert("Сначала выберите группу: Программисты, Дизайнеры или Другое"); return; }
        if(initUser(document.getElementById("studentNameInput").value)) {
            document.getElementById("nameScreen").style.display = "none";
            document.getElementById("mainMenu").style.display = "block";
            renderMainMenu();
        }
    });
    document.getElementById("changeUserBtn")?.addEventListener("click", () => {
        document.getElementById("mainMenu").style.display = "none";
        document.getElementById("nameScreen").style.display = "block";
        document.getElementById("studentNameInput").value = "";
        document.getElementById("programmersSelect").value = "";
        document.getElementById("designersSelect").value = "";
        document.getElementById("manualNameGroup").style.display = "none";
        document.getElementById("programmersGroup").style.display = "none";
        document.getElementById("designersGroup").style.display = "none";
        document.querySelectorAll(".group-btn").forEach(b => b.classList.remove("active"));
        currentStudentGroup = null;
        currentStudent = null;
    });
    document.getElementById("backToMenuBtn")?.addEventListener("click", () => backToMenu());
</script>
</body>
</html>
